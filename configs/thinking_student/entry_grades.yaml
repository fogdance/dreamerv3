# Graded entry teacher of the Thinking Student corpus (graded/, user decision
# 2026-10-28), read by gym_trading_env.research.ts_v1_grades and
# ts_v1_corpus (--grades). It grades the Native trade "ADD now, then hold" of
# every flat funded cursor: EXCELLENT / GOOD / FAIR / POOR per dimension, the
# trade's grade is its worst. GOOD or better demonstrates ADD, POOR
# demonstrates WAIT, FAIR nothing. SL30, other exits and a TP on a later
# official trading day are POOR.
#
# A change of these thresholds is new teaching material: regrade every corpus
# (ts_v1_grades --replace) and train a new run.
#
# mae_points and room_points are in ticks of the product (gym
# envs.entry_product, user 2026-11-08); FG is 1 point a tick.

# Market minutes from the fill to the TP within the same official trading
# day: EXCELLENT <= 15, GOOD <= 120, FAIR later that day.
time_minutes: [15, 120]
# mae_full of the facts (fill to exit, executable quotes, both spreads: FG 2
# points), EXCELLENT <= 3, GOOD <= 5, FAIR <= 10, POOR above: raw dips of 1 /
# 3 / 8 points below the open of the fill minute.
mae_points: [3, 5, 10]
# Room: the largest executable favourable move from the fill on the quotes a
# TP can fill at, EXCELLENT >= 10 (twice the TP), GOOD >= 7.5 (1.5 times),
# FAIR >= 6 (the TP and a tick), POOR below.
room_points: [10, 7.5, 6]
# The room window ends this many market minutes after the TP, cut at the end
# of the official trading day of the fill.
room_after_tp_minutes: 60
