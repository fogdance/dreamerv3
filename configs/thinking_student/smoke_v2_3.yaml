# Thinking Student V2.3 GPU smoke (plan docs/thinking_student_v2/V2_3_RULE_GATE_PLAN.md,
# step 5): formal_v2_3.yaml on two of its corpora, one SHORT (FG205) and one
# LONG (FG401), with tiny budgets and one round. An engineering run, never a
# result: it shows that under the rule gate the student's ADDs are at rule
# positions only (its exams fail otherwise), how its stops are sourced
# (RULE / CAPPED / GAP), and that CF forks start at legal minutes only.
# Every other key is the formal_v2_3.yaml one.
#
#   cd gym-trading-env && env PYTHONPATH=.:src:../dreamerv3 \
#     /home/v/miniconda3/envs/dreamerv3/bin/python -m dreamerv3.thinking_student.formal_train \
#     run --config ../dreamerv3/configs/thinking_student/smoke_v2_3.yaml --rounds 1

paths:  # relative paths are relative to this file
  markets: markets/pool.json
  corpus_root: /data/logdir/fg_single3/thinking_student/corpus_v2_3_20261105
  run_root: /data/logdir/fg_single3/thinking_student/SMOKE_V2_3_20261105
  strategy: markets/strategy_v2_3_rule_gate.yaml
  init_f1: /data/logdir/fg_single3/s3_v2/E_ONLY_MARKET_MINUTE_FORMAL_1M_v1_20261016/ckpt/step_000001000000

corpora:
  contracts: [CZCE.FG205, CZCE.FG401]
  mix: uniform_contract

dev:
  contracts: [CZCE.FG409]

student:
  preset: size50m
  device: cuda
  seed: 20261024
  batch_size: 16
  batch_length: 64
  log_every: 10
  window_start: carry
  carry_parallel: 2
  market: {macd: false, context_15m: 48}
  outcome_points: 10.0

foundation:
  market_updates: 40
  outcome_updates: 60
  policy_updates: 40
  save_every: 0
  holdout: 0

iteration:
  max_rounds: 1
  contracts_per_round: 2
  parallel_contracts: 2
  cf_wait_forks: 8
  cf_workers: 3
  cf_probe_steps: 64
  cf_budget: 48
  cf_min_coverage: 0.8
  cf_coverage: exploratory
  value_updates: 40
  prior_refresh_updates: 20
  save_every: 0
  holdout: 0
  beta_q: 1.0
  kappa_q: auto
  kappa_floor: 0.05
  state_check_windows: 0
  state_check_seed_offset: 1000003
  q_return: net_pnl_h2760
  l6:
    from_round: 7
    order: OFFLINE_TRAIN
    outcome_review_updates: 200
    correct_fraction: 0.25
    correct_boost: 4.0
    outcome_correct_prob: 0.5
    decision_correct_margin: 1.0
    remedial_fraction: 0
    remedial_boost: 1.0
    outcome_error_prob: 0.1
    decision_error_margin: 1.0

evaluation:
  random_seeds: 5
  smoke_contracts: 2
  smoke_steps: 6000

review:
  label: V2.3 · smoke
