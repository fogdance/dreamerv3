# Live SA701, V3 long trend (user 2026-11-06: "将v3做一个live，fg，sa,如果很麻烦，可以开两个live"): the V2.4 1x
# pi_0005 with the paper strategy of PAPER_V3_TREND_V2_4_POLICIES_20261106 (../../strategy_v3_trend_trail.yaml):
# the rule gate of rules V5, SL = touch H + 5 / L - 5, R <= 10, then the swing-trail stop, no TP.
# ../CZCE_FG701_env.yaml pattern (live_mode, DB bars, order RPC sim account); one live per contract.
debug:
  log_level: ERROR
entry:
  chunk_steps: 0
  contract: CZCE.SA701
  contract_config: ../CZCE_SA701_contract.yaml
  strategy_config: strategy.yaml
  protocol: fg_single3_v1
  live:
    history_days: 10
    poll_seconds: 2
    max_signal_age_seconds: 90
    rpc_enabled: true
    # A notify-send desktop notification per open and close (default true; user 2026-11-06).
    notify: true
    action_log: /data/logdir/fg_single3/thinking_student/LIVE_SA701_V3_TREND_20261106/live_actions.jsonl
  stop_rule: prior_15m_extreme
  stop_above_points: 5
  max_risk_points: 10
  target_r: 2
  prior_high:
    pivot_left: 2
    pivot_right: 2
    lookback_buckets: 115
    departure_points: 10
  context_15m_buckets: 48
  rule_gate:
    SHORT: ../../../v2_positive_entry_v5_h5_stop.yaml
    LONG: ../../../v2_positive_entry_v5_long_h5_stop.yaml
  # The product profile's rule_overrides (products/sa.yaml: none), as ../../strategy_v3.yaml.
  product_rules: true
  # V3: no TP; the stop moves with the 15m troughs (a LONG: peaks) after the fill
  # (gym research.swing_trail, the same block as ../../strategy_v3_trend_trail.yaml).
  exit_rule:
    kind: swing_trail
    timeframe: 15m
    pivot_left: 2
    pivot_right: 2
    breakeven_points: 8
    lock_points: 5
strategy_mode: entry_only
trading:
  currency_pair: SA701
  data_interval: 1m
  data_tz: Asia/Shanghai
  future_symbol: CZCE.SA701
  initial_balance: 300000
  is_future: true
  live_mode: true
  max_long_position: 3
  max_short_position: 3
  obs_feature_mode: obs
  session_policy:
    force_flatten_eod: false
    block_open_near_eod: false
  stop_loss_enabled: true
  trade_lot: 3
training:
  bar_source: csv
  episode_policy:
    truncate_on_session_end: false
  randomize_start: false
  window_size: 60
