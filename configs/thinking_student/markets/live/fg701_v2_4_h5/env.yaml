# Live FG701 SHORT, V2.4 pi_0005 with the touch-line stop (user 2026-11-05: "将v2.4做一个live";
# H+5 止损 + pi_0005, FG701 做空, GPU): ../CZCE_FG701_env.yaml (live_mode, DB bars, order RPC sim
# account) with the entry keys of strategy_v2_5_h5_stop.yaml: the rule gate of rules V6 (the rules of
# the H+5 paper PAPER_V2_4_1X_H5STOP_20261105, same values), SL = touch H + 5, R <= 10, TP 2R.
debug:
  log_level: ERROR
entry:
  chunk_steps: 0
  contract: CZCE.FG701
  contract_config: ../CZCE_FG701_contract.yaml
  strategy_config: strategy.yaml
  protocol: fg_single3_v1
  live:
    history_days: 10
    poll_seconds: 2
    max_signal_age_seconds: 90
    rpc_enabled: true
    action_log: /data/logdir/fg_single3/thinking_student/LIVE_FG701_V2_4_H5_20261105/live_actions.jsonl
  stop_rule: prior_15m_extreme
  stop_above_points: 5
  max_risk_points: 10
  target_r: 2
  prior_high:
    pivot_left: 2
    pivot_right: 2
    lookback_buckets: 115
    departure_points: 10
  context_15m_buckets: 48
  rule_gate:
    SHORT: ../../../v2_positive_entry_v6.yaml
    LONG: ../../../v2_positive_entry_v6_long.yaml
strategy_mode: entry_only
trading:
  currency_pair: FG701
  data_interval: 1m
  data_tz: Asia/Shanghai
  future_symbol: CZCE.FG701
  initial_balance: 300000
  is_future: true
  live_mode: true
  max_long_position: 3
  max_short_position: 3
  obs_feature_mode: obs
  session_policy:
    force_flatten_eod: false
    block_open_near_eod: false
  stop_loss_enabled: true
  trade_lot: 3
training:
  bar_source: csv
  episode_policy:
    truncate_on_session_end: false
  randomize_start: false
  window_size: 60
