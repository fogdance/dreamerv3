# Thinking Student V2.1 strategy with the user's real costs (user 2026-11-05: "v2.2那部分，将交易
# 成本的修改也合并到那个worktree, 重新跑paper"): strategy_v2_1_structural.yaml, the strategy of the
# V2.1 / V2.2 corpora, unchanged but its costs, which come from the CZCE_FG cost preset of V2.4
# (costs_fg_real_20261105.yaml: open and close 2.1 CNY per lot, spread 0, no slippage). For the
# paper of the V2.2 1x under real costs only; no ADD gate.
version: V2_1_STRUCTURAL_R10_REAL_COSTS
costs: costs_fg_real_20261105.yaml
direction: BOTH
entry:
  # SHORT: SL = H* + 5 with H* the lowest causal prior 15m pivot high
  # (confirmed, not broken, within the lookback, already departed by a 1m
  # close at H - 10) at or above the fill; TP = fill - 2R.
  # LONG, the mirror: SL = L* - 5 with L* the highest causal prior 15m pivot
  # low (departed by a 1m close at L + 10) at or below the fill; TP = fill + 2R.
  # R = |SL - fill| <= 10 (user 2026-10-31). Further than 10 or no such line:
  # R = 10, recorded per trade as stop_source CAPPED / NO_LINE. Stateless.
  stop_rule: prior_15m_extreme
  stop_above_points: 5
  max_risk_points: 10
  target_r: 2
  # The lines of the V2_1 positive material (v2_positive_entry.yaml and its
  # LONG mirror v2_positive_entry_long.yaml).
  prior_high: {pivot_left: 2, pivot_right: 2, lookback_buckets: 115, departure_points: 10}
  # Complete 15m buckets in the student's market context (24 before).
  context_15m_buckets: 48
reward:
  # Each exit pays its realized net trade PnL (both fees) / 618 CNY: one
  # full 10-point SL of 3 lots (10 x 3 x 20 + 18 fees) is -1, LONG or SHORT.
  schema: FG_SINGLE3_REWARD_NET_PNL_V1
  reward_scale_cny: 618
