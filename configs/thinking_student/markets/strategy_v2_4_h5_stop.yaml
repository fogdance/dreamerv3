# Paper only (user 2026-11-05: "v2.4新建个分支，直接将止损换回结构止损（H+5），其他不变，跑paper"):
# strategy_v2_4_fixed_stop.yaml with the rules of v2_positive_entry_v5(_long)_h5_stop.yaml: the same rule
# gate and real costs, the stop of a gated ADD its touch's own line (SL = H + 5 / L - 5, R <= 10, a gap
# beyond capped at 10: RULE / CAPPED / GAP), TP = fill -/+ 2R.
version: V2_4_RULE_GATE_H5_STOP
direction: BOTH
entry:
  # The stop of a gated ADD is its touch's own line: SHORT SL = H + 5, LONG
  # SL = L - 5, R = |SL - fill| <= 10, TP = fill -/+ 2R (RULE; a gap beyond 10
  # points of risk CAPPED, a fill through the stop GAP, both R = 10).
  stop_rule: prior_15m_extreme
  stop_above_points: 5
  max_risk_points: 10
  target_r: 2
  # The lines of the V5 material (the same as V2.1 / V2.2).
  prior_high: {pivot_left: 2, pivot_right: 2, lookback_buckets: 115, departure_points: 10}
  # Complete 15m buckets in the student's market context.
  context_15m_buckets: 48
  # The rule of each side, paths relative to this file: the env opens ADD at
  # its rule positions only (gym ts_v2_positive.rule_cursors, the material's
  # own pass).
  rule_gate:
    SHORT: ../v2_positive_entry_v5_h5_stop.yaml
    LONG: ../v2_positive_entry_v5_long_h5_stop.yaml
reward:
  # Each exit pays its realized net trade PnL (both fees) / 618 CNY, the scale
  # of V2.1 and V2.2 (one full 10-point SL of 3 lots with the old fees).
  schema: FG_SINGLE3_REWARD_NET_PNL_V1
  reward_scale_cny: 618
