# V2 positive entry corpus: "rebound to the prior 15m high, then short"
# (Spec V0.3, user 2026-10-31), read by gym
# gym_trading_env.research.ts_v2_positive --config. The rules are frozen
# before generation (docs/thinking_student_v2/DESIGN.md); a change of any
# value is a new version of the material, reported, never silently retuned.
version: V2_POSITIVE_ENTRY_V1
# The TRAIN direction schedule (strategy_quality_tp_v1.yaml directions) is
# user-configured and not shown to be known ex ante.
direction: SHORT
direction_source: DIRECTION_ASSUMED

prior_high:
  # A complete 15m bucket whose High is above the `left` buckets before it
  # and not below the `right` buckets after it; visible once the last of
  # those is available.
  pivot_left: 2
  pivot_right: 2
  # A level is used only while its bucket is at most this many complete
  # buckets old (about two trading days).
  lookback_buckets: 46
  # The rebound must start from a 1m close at least this far below H.
  departure_points: 10

volume:
  # RV = 1m volume / mean volume of the previous valid 1m bars; the first
  # minute of each market segment (auction volume) is neither a trigger nor
  # part of the baseline.
  baseline_minutes: 20
  ratio: 2.0
  exclude_segment_open: true

event:
  # Activation needs the trigger bar's High at least H - near_points.
  near_points: 5
  # Candidates up to this many market minutes after activation.
  window_minutes: 60

entry:
  # The decision-time sell quote (Close - spread) and the actual fill (next
  # Open - spread) both within [H - zone_points, H].
  zone_points: 5
  # SL = H + stop_above_points; planned risk R = SL - fill, 0 < R <= max_risk.
  stop_above_points: 5
  max_risk_points: 10
  # The teacher target TP = fill - target_r * R; parallel_r is recorded only.
  target_r: 2.0
  parallel_r: 1.5

quality:
  # A positive reached the target_r TP (Native); EXCELLENT / GOOD by its MAE
  # (max High - fill, points, as a share of R) and its market minutes to TP.
  excellent: {mae_r: 0.5, held_minutes: 120}
  good: {mae_r: 0.8, held_minutes: 345}

timeline:
  # Each WAIT phase before activation keeps its first and last row plus at
  # most this many evenly spaced rows.
  wait_rows_per_phase: 8

figures:
  max_events: 12
  per_contract: 2
