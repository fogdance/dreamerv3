# src/gym_trading_env/config/default_config.yaml


XAUUSD: &XAUUSD
  currency_pair: "XAUUSD"
  initial_balance: 1000.0
  trading_fee_per_lot: 6
  is_round_turn: false
  spread: 0.07
  leverage: 500
  lot_size: 100
  trade_lot: 0.01
  max_long_position: 0.05
  max_short_position: 0.05
  data_path: "XAUUSD"
  data_interval: "1m"
  down_thresh_5m: -0.0001
  up_thresh_5m: 0.0001
  down_thresh_15m: -0.00015
  up_thresh_15m: 0.00015
  down_thresh_1h: -0.00025
  up_thresh_1h: 0.00025


EURUSD: &EURUSD
  currency_pair: "EURUSD"
  initial_balance: 1000.0
  trading_fee_per_lot: 3
  is_round_turn: true
  spread: 0.0002
  leverage: 500
  lot_size: 100000
  trade_lot: 0.01
  max_long_position: 0.02
  max_short_position: 0.02
  data_path: "EURUSD"
  data_interval: "5m"
  down_thresh_5m: -0.0001
  up_thresh_5m: 0.0001
  down_thresh_15m: -0.00015
  up_thresh_15m: 0.00015
  down_thresh_1h: -0.00025
  up_thresh_1h: 0.00025

DCE_JM2601: &JM
  currency_pair: "JM2601"
  initial_balance: 10000.0
  trading_fee_per_lot: 3
  is_round_turn: true
  spread: 0.5
  leverage: 10
  lot_size: 60
  trade_lot: 1
  max_long_position: 1
  max_short_position: 1
  # data_path: "180D_DCE_JM2601"
  data_path: "18M_DCE_JM2601"
  data_interval: "1m"
  stop_loss_enabled: true
  stop_loss_mode: abs  # pct | abs
  stop_loss_value: 5 # pct=2%
  take_profit_enabled: true
  take_profit_mode: rr  
  take_profit_rr: 1.5
  is_future: true
  obs_feature_mode: "obs"
  use_daily_context: false
  use_daily_seq_7: false
  invalid_action_punish: 0.001
  # trading_date: "2025-12-23"
  future_symbol: "DCE.jm2601"
  session_policy:
    near_eod_bars: 2
    block_open_near_eod: true
    force_flatten_eod: false

SHFE_RB: &RB
  currency_pair: "SHFE_RB"
  initial_balance: 10000.0
  trading_fee_per_lot: 3
  is_round_turn: true
  spread: 1
  leverage: 10
  lot_size: 10
  trade_lot: 1
  max_long_position: 1
  max_short_position: 1
  data_path: "SHFE_RB"
  data_interval: "1m"
  stop_loss_enabled: false
  stop_loss_mode: pct  # pct | abs
  stop_loss_value: 0.02 # pct=2%
  take_profit_enabled: false
  take_profit_mode: rr  
  take_profit_rr: 1.5
  is_future: true
  obs_feature_mode: "obs"
  use_daily_context: false
  use_daily_seq_7: false
  # trading_date: "2025-12-23"
  future_symbol: "SHFE.RB"
  session_policy:
    near_eod_bars: 2
    block_open_near_eod: true
    force_flatten_eod: false

trading:
  <<: *JM

risk:
  max_drawdown_ratio: 0.5
  daily_lost_ratio: 0.3
  risk_reward_ratio: 1
  risk_reward_ratio_enable: false

training:
  reward_function: "futures_intraday_reward_function"
  window_size: 60
  max_episode_steps: 345
  randomize_start: true
  render_mode: "none"
  start_clock: "future_night"   # 或 'future_day' / 'future_night' / 'any'
  bar_source: "csv" # csv/juejin
  episode_policy:
    truncate_on_session_end: true   # MC false; 训练/实盘 true


visualization:
  image_width: 128
  image_height: 48
  image_channels: 1

